<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      @page {
        margin: 1in;
        @top-center {
          content: element(pageHeader);
        }
        @bottom-center {
          content: element(pageFooter);
        }
      }
      
      body { 
        font-family: Arial, sans-serif; 
        margin: 0;
        padding: 0;
        line-height: 1.4;
        color: #333;
      }
      
      .page-header {
        position: running(pageHeader);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
        font-size: 12px;
        margin-bottom: 20px;
        text-align: center;
      }

      .school-name {
        font-size: 1.5rem; /* similar to text-2xl */
        color: #0011ff; /* Tailwind yellow-400 hex */
        font-family: 'Matura MT Script Capitals', cursive;
        margin-bottom: 0.5rem; /* similar to mb-2 */
        }
      
      .page-footer {
        position: running(pageFooter);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid #ddd;
        font-size: 10px;
        margin-top: 20px;
      }
      
      .header-container {
        text-align: center;
        margin-bottom: 30px;
        page-break-after: avoid;
      }
      
      .logo-section {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 15px;
      }
      
      .logo {
        width: 70px;
        height: auto;
        max-height: 120px;
        object-fit: contain;
      }
      
      .logo-placeholder {
        width: 120px;
        height: 120px;
        background-color: #f8f9fa;
        border: 2px dashed #dee2e6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
        font-size: 14px;
        font-weight: 500;
        border-radius: 8px;
      }
      
      .header-text {
        text-align: center;
      }
      
      .header-title {
        font-weight: bold;
        font-size: 18px;
        line-height: 1.3;
        margin-bottom: 8px;
        color: #2c3e50;
      }
      
      .header-subtitle {
        font-size: 14px;
        color: #34495e;
        margin-bottom: 15px;
      }
      
      .header-separator {
        width: 200px;
        height: 2px;
        background: linear-gradient(to right, #3498db, #2980b9);
        margin: 15px auto;
      }
      
      .report-title {
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
        margin: 15px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      .content-wrapper {
        min-height: calc(100vh - 200px);
      }
      
      table {
        width: 100%; 
        border-collapse: collapse; 
        margin-bottom: 20px;
        font-size: 12px;
      }
      
      th, td { 
        border: 1px solid #dee2e6; 
        padding: 10px 8px; 
        text-align: left; 
        vertical-align: top;
        word-wrap: break-word; 
      }
      
      th { 
        background-color: #f8f9fa; 
        font-weight: bold; 
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #495057;
      }
      
      tr:nth-child(even) {
        background-color: #f8f9fa;
      }
      
      tr:hover {
        background-color: #e3f2fd;
      }
      
      .inventory-number {
        font-size: 10px;
        font-family: monospace;
        background-color: #e9ecef;
        padding: 2px 4px;
        border-radius: 3px;
      }
      
      .unit-cost { 
        font-size: 11px;
        font-weight: bold;
        color: #28a745;
        text-align: right;
      }
      
      .description {
        line-height: 1.4;
        min-width: 150px; 
        font-size: 12px;
      }
      
      .description .item-name {
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 4px;
      }
      
      .description .item-desc {
        color: #6c757d;
        font-size: 11px;
        margin-bottom: 4px;
      }
      
      .description .serial-number {
        font-size: 10px;
        color: #007bff;
        font-family: monospace;
        background-color: #e7f3ff;
        padding: 1px 4px;
        border-radius: 3px;
      }
      
      .borrower-info { 
        font-size: 10px;
        color: #6c757d;
        margin-top: 4px;
      }
      
      .borrower-name {
        font-weight: bold;
        color: #495057;
        font-size: 11px;
      }
      
      .signature-section {
        margin-top: 50px;
        page-break-inside: avoid;
      }
      
      .signature-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 40px;
      }
      
      .signature-cell {
        border: 1px solid #333;
        padding: 20px;
        text-align: center;
        width: 50%;
        vertical-align: top;
      }
      
      .signature-label {
        text-align: left;
        font-weight: bold;
        margin-bottom: 30px;
        font-size: 12px;
      }
      
      .signature-line {
        border-bottom: 1px solid #333;
        width: 80%;
        margin: 20px auto 5px auto;
        height: 1px;
      }
      
      .signature-text {
        font-size: 11px;
        color: #666;
        margin-bottom: 15px;
      }
      
      .signature-date {
        font-weight: bold;
        margin: 20px 0 5px 0;
        font-size: 12px;
      }
      
      /* Print-specific styles */
      @media print {
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        
        .header-container {
          page-break-after: avoid;
        }
        
        table {
          page-break-inside: avoid;
        }
        
        tr {
          page-break-inside: avoid;
        }
        
        .signature-section {
          page-break-before: auto;
          page-break-inside: avoid;
        }
      }
    </style>
</head>
<body>
    <div class="page-header" id="pageHeader">
      <div>
        Republic of the Philippines
      </div>
      <div class="school-name">
        <strong>MINDANAO STATE UNIVERSITY AT NAAWAN</strong>
      </div>

    </div>
    
</body>
</html>
